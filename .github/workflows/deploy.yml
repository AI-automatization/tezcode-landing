name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate: block the deploy when Uzbek copy has Cyrillic letters mixed in.
      # It looks correct to the eye but silently breaks the search keyword.
      # Pure Node, no install needed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check language purity (uz = Latin, ru/uk = Cyrillic)
        run: node scripts/check-mixed-script.mjs

      - name: Install Railway CLI
        run: |
          bash <(curl -fsSL cli.new)
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service tezcode-landing --ci
